<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки: 14 недель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#E6EAF0; --line:#C9CDD3;
  --text:#1F2A44; --muted:#5D6472; --green:#1E4D3A; --green-soft:#DCE8E1;
  --wine:#6D1F2F; --wine-soft:#F3DFE3; --steel:#7A95B0; --on-green:#F3F5F8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A29; --surface:#1F2A44; --surface2:#2A3654; --line:#3B4662;
    --text:#F3F5F8; --muted:#A7B0C0; --green:#63A786; --green-soft:#1D3A2F;
    --wine:#D7728A; --wine-soft:#40222F; --steel:#A7B8C8; --on-green:#0F1B15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A29; --surface:#1F2A44; --surface2:#2A3654; --line:#3B4662;
  --text:#F3F5F8; --muted:#A7B0C0; --green:#63A786; --green-soft:#1D3A2F;
  --wine:#D7728A; --wine-soft:#40222F; --steel:#A7B8C8; --on-green:#0F1B15;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:18px 16px 170px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3{margin:0}

/* Week header */
.top{padding:4px 2px 14px}
.wk{display:flex;align-items:baseline;gap:8px}
.wk-n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.wk-of{color:var(--muted);font-size:17px}
.phase{font-weight:600;margin-top:4px}
.hint{color:var(--muted);margin:4px 0 0;font-size:15px}
.strip{display:flex;gap:3px;margin-top:12px}
.strip i{flex:1;height:9px;border-radius:2px;background:var(--surface2)}
.strip i.past{background:var(--steel)}
.strip i.deload{background:transparent;box-shadow:inset 0 0 0 1.5px var(--wine)}
.strip i.past.deload{background:var(--wine-soft)}
.strip i.now{background:var(--green);height:13px;margin-top:-2px}

/* Day switcher */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 16px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:8px 6px;text-align:left;line-height:1.2}
.days button small{display:block;color:var(--muted);font-size:13px}
.days button b{font-weight:600}
.days button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.75}

/* Exercise */
.ex{background:var(--surface);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px;
  border:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-head h3{font-size:17px;font-weight:600;line-height:1.3}
.plan{white-space:nowrap;font-weight:600;color:var(--green)}
.last{margin:4px 0 0;color:var(--muted);font-size:14px}
.up{margin:6px 0 0;display:inline-block;background:var(--wine-soft);color:var(--wine);
  font-weight:600;font-size:14px;padding:3px 9px;border-radius:8px}
.cols,.set{display:grid;grid-template-columns:26px 1fr 14px 1fr 48px;gap:8px;align-items:center}
.cols{margin-top:10px;font-size:12px;color:var(--muted)}
.cols span:nth-child(2),.cols span:nth-child(4){padding-left:4px}
.set{margin-top:6px}
.sn{color:var(--muted);font-size:14px;text-align:center}
.x{color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--text);font:inherit;font-size:18px;padding:0 10px;
  font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.7}
.chk{height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;
  display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted)}
.set.done input{background:var(--green-soft);border-color:transparent}
.set.done .chk{background:var(--green);border-color:var(--green)}
.set.done .chk svg{stroke:var(--on-green)}
.ex-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:8px}
.ghost{background:none;border:none;color:var(--steel);font-weight:500;padding:8px 2px}
details{font-size:14px;color:var(--muted);text-align:right;max-width:70%}
summary{cursor:pointer;color:var(--steel);font-weight:500;padding:8px 2px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open]{text-align:left;max-width:100%;flex-basis:100%}
details p{margin:2px 0 6px}
.ex-foot:has(details[open]){flex-wrap:wrap}

.actions{display:flex;gap:10px;margin-top:18px;align-items:center}
.primary{flex:1;background:var(--green);color:var(--on-green);border:none;border-radius:14px;
  padding:15px;font-weight:600;font-size:17px}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* Cards / journal */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;font-weight:600;margin-bottom:10px}
.card p{margin:0 0 8px}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--text);font:inherit;font-size:17px;padding:0 10px;width:100%;min-width:0}
.form .full{grid-column:1 / -1}
.status{border-radius:12px;padding:10px 12px;font-weight:500}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.warn{background:var(--wine-soft);color:var(--wine)}
.status.idle{background:var(--surface2)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--surface2)}
.tbl td.num,.tbl th.num{text-align:right}
.spark{width:100%;height:auto;display:block;margin:4px 0 10px}
.spark polyline{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--green)}
.spark text{fill:var(--muted);font-size:11px;font-family:inherit}
.hist{border-bottom:1px solid var(--surface2)}
.hist:last-child{border-bottom:none}
.hist > button{width:100%;display:flex;justify-content:space-between;background:none;border:none;
  padding:11px 0;text-align:left}
.hist .det{padding:0 0 12px;font-size:14px}
.hist .det div{margin:3px 0}
.del{background:none;border:none;color:var(--wine);padding:6px 0;font-size:14px}
.rowx{display:flex;justify-content:space-between;align-items:center}

/* Nutrition */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.macro b{display:block;font-size:20px;font-weight:700}
.macro span{font-size:13px;color:var(--muted)}
.macro.kcal{background:var(--text);color:var(--bg);border-color:var(--text)}
.macro.kcal span{color:inherit;opacity:.75}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}

/* Timer + tabs */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  display:none;justify-content:center;padding:0 12px 8px;pointer-events:none}
.timer.on{display:flex}
.timer .box{pointer-events:auto;width:100%;max-width:536px;background:var(--text);color:var(--bg);
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--green)}
.timer .t{font-size:24px;font-weight:700;min-width:64px}
.timer .lbl{flex:1;font-size:14px;opacity:.8}
.timer button{background:none;border:1px solid currentColor;border-radius:9px;padding:6px 9px;font-size:14px;opacity:.9}
.timer.done .box{background:var(--green);color:var(--on-green)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.tabs div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tabs button{background:none;border:none;height:64px;font-weight:500;color:var(--muted);font-size:15px}
.tabs button[aria-current="page"]{color:var(--text);font-weight:600;box-shadow:inset 0 3px 0 var(--green)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>

<div class="timer" id="timer" aria-live="polite">
  <div class="box">
    <span class="t" id="tT">0:00</span>
    <span class="lbl" id="tL">Отдых</span>
    <button type="button" data-act="t-minus">−15</button>
    <button type="button" data-act="t-plus">+15</button>
    <button type="button" data-act="t-stop">Хватит</button>
    <span class="bar" id="tB"></span>
  </div>
</div>

<nav class="tabs" aria-label="Разделы"><div>
  <button type="button" data-tab="workout">Тренировка</button>
  <button type="button" data-tab="journal">Журнал</button>
  <button type="button" data-tab="food">Питание</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* ---------- Program ---------- */
const DAYS = {
  back: {wd:"Вт", label:"Спина", dow:2, ex:[
    {key:"pull", name:"Подтягивания или тяга верхнего блока", b1:[4,6,10], b2:[4,5,8], rest:150, inc:2.5,
      start:"свой вес (0 кг) или вес блока с запасом 2–3 повтора",
      tip:"Начинай с опускания лопаток, тянись грудью к перекладине, внизу руки выпрямлены. При 10+ чистых повторах — с весом на поясе."},
    {key:"bbrow", name:"Тяга штанги в наклоне", b1:[3,8,10], b2:[4,6,8], rest:150, inc:2.5,
      start:"подбери вес с запасом 2–3 повтора",
      tip:"Корпус около 45°, спина прямая, тяга к поясу. Округляется поясница — вес слишком большой."},
    {key:"cablerow", name:"Тяга нижнего блока", b1:[3,10,12], rest:90, inc:2.5,
      start:"подбери вес с запасом 2–3 повтора",
      tip:"Корпус почти неподвижен, без отклонения назад. Тяни к поясу, в конце пауза 1 секунда со сведёнными лопатками."},
    {key:"pullover", name:"Пуловер (гантель или верхний блок)", b1:[3,12,15], rest:75, inc:2,
      start:"лёгкий вес, со следующей недели",
      tip:"Руки почти прямые, движение только в плечах. Опускай до растяжения в широчайших, без прогиба в пояснице."},
    {key:"facepull", name:"Face pull", b1:[3,15,20], rest:60, inc:2.5,
      start:"лёгкий вес или резинка",
      tip:"Канат на уровне глаз, тяни к лицу, разводя руки. В конце большие пальцы смотрят назад."},
    {key:"latcable", name:"Махи лёжа на боку или на нижнем блоке", b1:[3,15,20], rest:60, inc:1, per:"на руку",
      start:"лёгкий вес",
      tip:"Рука до уровня плеча, плечо не поднимается к уху, опускание медленное."},
    {key:"hammer", name:"Молотки", b1:[2,10,12], rest:60, inc:1,
      start:"подбери вес с запасом 2–3 повтора",
      tip:"Только поддерживающий объём: бицепс у тебя развит."}
  ]},
  chest: {wd:"Чт", label:"Грудь", dow:4, ex:[
    {key:"incdb", name:"Жим гантелей на наклонной 30°", b1:[4,8,10], b2:[4,6,8], rest:150, inc:2, startW:16,
      start:"16 кг, разминка 10 кг ×12 и 13,5 кг ×6",
      tip:"Лопатки сведены и прижаты, локти 45–60° к корпусу, гантели до уровня груди, вниз 2–3 секунды."},
    {key:"bench", name:"Жим штанги лёжа", b1:[3,8,10], b2:[4,5,8], rest:150, inc:2.5, startW:60,
      start:"60–62,5 кг, разминка 40 кг ×5",
      tip:"Гриф на низ груди, стопы в пол. Без страховки — в стойке с упорами или гантелями, без отказа."},
    {key:"incfly", name:"Разводка гантелей на наклонной", b1:[3,12,15], rest:75, inc:1, startW:8,
      start:"8–10 кг",
      tip:"Локти чуть согнуты, внизу пауза в растяжении, своди руки дугой."},
    {key:"dips", name:"Отжимания на брусьях", b1:[2,8,12], b2:[3,8,12], rest:90, inc:2.5, startW:0,
      start:"свой вес (0 кг)",
      tip:"Корпус чуть вперёд. Появился дискомфорт в плечах — убери упражнение."},
    {key:"ohp", name:"Жим гантелей сидя", b1:[3,8,10], rest:120, inc:2, startW:14,
      start:"14 кг",
      tip:"Спинка 80–85°, поясница прижата, наверху руки до конца не выпрямляй."},
    {key:"lat", name:"Махи в стороны", b1:[4,12,20], rest:60, inc:1, startW:7.5,
      start:"7–8 кг",
      tip:"Корпус неподвижен, локоть чуть впереди кисти, до уровня плеча, вниз 2–3 секунды. Без раскачки."},
    {key:"tri", name:"Трицепс на блоке", b1:[3,10,15], rest:60, inc:2.5, startW:42.5,
      start:"40–45 кг",
      tip:"Локти прижаты к корпусу, внизу руки полностью выпрямлены."}
  ]},
  legs: {wd:"Сб", label:"Ноги", dow:6, ex:[
    {key:"squat", name:"Присед со штангой", b1:[4,6,10], b2:[4,5,8], rest:180, inc:2.5,
      start:"подбери вес с запасом 2–3 повтора. Нет стойки — гоблет-присед 4 × 10–15",
      tip:"До параллели или чуть ниже, колени по линии носков, вес на всей стопе."},
    {key:"rdl", name:"Румынская тяга", b1:[3,8,10], b2:[3,6,8], rest:150, inc:2.5,
      start:"подбери вес с запасом 2–3 повтора",
      tip:"Таз назад, колени чуть согнуты, гриф скользит вдоль ног до середины голени."},
    {key:"bulg", name:"Болгарские выпады", b1:[3,8,12], rest:90, inc:2, per:"на ногу",
      start:"гантели с запасом 2–3 повтора",
      tip:"Начинай со слабой ноги, корпус прямо или с небольшим наклоном."},
    {key:"curl", name:"Сгибания ног", b1:[3,10,15], rest:75, inc:2.5,
      start:"тренажёр, гантель между стоп или полотенце",
      tip:"Внизу пауза 1 секунда, опускай медленно."},
    {key:"lat", name:"Махи в стороны", b1:[4,12,20], rest:60, inc:1,
      start:"7–8 кг",
      tip:"Техника та же, что в четверг."},
    {key:"rdelt", name:"Обратная разводка лёжа на наклонной", b1:[3,15,15], rest:60, inc:1,
      start:"лёгкие гантели",
      tip:"Плечи опущены, руки расходятся за счёт задней дельты, а не сведения лопаток."},
    {key:"calf", name:"Икры на ступеньке", b1:[3,12,15], rest:60, inc:2,
      start:"гантель в руке",
      tip:"Пауза вверху и внизу, полная амплитуда."},
    {key:"abs", name:"Пресс", b1:[3,10,15], rest:60, inc:0,
      start:"ролик или скручивания на блоке",
      tip:"Без рывков, поясница под контролем."}
  ]}
};
const NAME_BY_KEY = {};
Object.values(DAYS).forEach(d => d.ex.forEach(e => { if(!NAME_BY_KEY[e.key]) NAME_BY_KEY[e.key] = e.name; }));
NAME_BY_KEY.lat = "Махи в стороны";

function phaseOf(w){
  if (w <= 2)  return {name:"Возвращение после болезни", hint:"Веса чуть ниже максимума, оставляй 2–3 повтора в запасе.", block:1, deload:false};
  if (w <= 6)  return {name:"Блок 1: объём", hint:"Двойная прогрессия, 1–2 повтора в запасе.", block:1, deload:false};
  if (w === 7) return {name:"Разгрузка", hint:"Те же веса, подходов вдвое меньше. Восстанавливайся.", block:1, deload:true};
  if (w <= 13) return {name:"Блок 2: тяжелее", hint:"В базовых меньше повторов и больше вес, отдых до 3 минут.", block:2, deload:false};
  return {name:"Разгрузка, фото, замеры", hint:"Те же веса, вдвое меньше подходов. Сделай фото и замеры.", block:2, deload:true};
}
function planOf(ex, ph){
  const a = (ph.block === 2 && ex.b2) ? ex.b2 : ex.b1;
  return {sets: ph.deload ? Math.ceil(a[0]/2) : a[0], lo:a[1], hi:a[2]};
}

/* ---------- Utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = n => n == null ? "" : String(Math.round(n*100)/100).replace(".", ",");
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
const todayISO = () => iso(new Date());
const dShort = s => parseISO(s).toLocaleDateString("ru-RU", {day:"numeric", month:"short"});
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
function loadLS(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function saveLS(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---------- State ---------- */
const START_DEFAULT = "2026-10-05";
const LS_STATE = "gt-state-v1", LS_DRAFT = "gt-draft-v1";
function normalize(d){
  d = d || {};
  return {
    startDate: typeof d.startDate === "string" ? d.startDate : START_DEFAULT,
    sessions: Array.isArray(d.sessions) ? d.sessions.slice() : [],
    body: Array.isArray(d.body) ? d.body.slice() : []
  };
}
let state = normalize(loadLS(LS_STATE));
let drafts = loadLS(LS_DRAFT) || {};
const ui = {tab:"workout", day:defaultDay(), open:null, stale:false};
const store = {mode:"local", ref:null, writing:false, again:false, note:""};

function defaultDay(){
  const g = new Date().getDay();
  return (g === 3 || g === 4) ? "chest" : (g === 5 || g === 6) ? "legs" : "back";
}
function weekOfDate(s){ return Math.floor((parseISO(s) - parseISO(state.startDate)) / 864e5 / 7) + 1; }
function curWeek(){ return Math.max(1, weekOfDate(todayISO())); }

/* ---------- IndexedDB ---------- */
const DB_NAME = "gym-tracker", DB_VER = 1;
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("no idb"));
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore("sessions", {keyPath:"id"});
        d.createObjectStore("body", {keyPath:"date"});
        d.createObjectStore("meta", {keyPath:"k"});
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  loadAll(){
    return new Promise((res, rej) => {
      const tx = this.db.transaction(["sessions","body","meta"], "readonly");
      const out = {sessions:[], body:[], startDate:null};
      tx.objectStore("sessions").getAll().onsuccess = e => { out.sessions = e.target.result; };
      tx.objectStore("body").getAll().onsuccess = e => { out.body = e.target.result; };
      tx.objectStore("meta").get("startDate").onsuccess = e => { out.startDate = e.target.result ? e.target.result.v : null; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
    });
  },
  saveAll(st){
    return new Promise((res, rej) => {
      const tx = this.db.transaction(["sessions","body","meta"], "readwrite");
      const s = tx.objectStore("sessions"), b = tx.objectStore("body");
      s.clear(); b.clear();
      st.sessions.forEach(x => s.put(x));
      st.body.forEach(x => b.put(x));
      tx.objectStore("meta").put({k:"startDate", v:st.startDate});
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
};

async function persist(){
  saveLS(LS_STATE, state); /* зеркальная копия на случай проблем с IndexedDB */
  if (store.mode !== "db") return;
  if (store.writing){ store.again = true; return; }
  store.writing = true;
  try { await DB.saveAll(JSON.parse(JSON.stringify(state))); }
  catch(e){ toast("Не удалось записать в базу, копия осталась в localStorage"); }
  store.writing = false;
  if (store.again){ store.again = false; persist(); }
}
let draftT = null;
function saveDraftSoon(){ clearTimeout(draftT); draftT = setTimeout(() => saveLS(LS_DRAFT, drafts), 300); }

async function initStore(){
  try {
    DB.db = await DB.open();
    const saved = await DB.loadAll();
    if (saved.sessions.length || saved.body.length || saved.startDate){
      state = normalize(saved);
    } else if (state.sessions.length || state.body.length){
      /* первый запуск: переносим старые данные из localStorage в базу */
      await DB.saveAll(JSON.parse(JSON.stringify(state)));
    }
    store.mode = "db";
    store.note = "Данные хранятся в базе браузера на этом устройстве. Раз в пару недель делай экспорт.";
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    saveLS(LS_STATE, state);
  } catch(e){
    store.mode = "local";
    store.note = "База браузера недоступна, данные хранятся в localStorage.";
  }
  render(true);
}

/* ---------- Export / import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({app:"gym-tracker", v:1, exported:new Date().toISOString(), data:state}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "trainer-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Файл с копией сохранён");
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      const inc = normalize(j && j.data ? j.data : j);
      if (!inc.sessions.length && !inc.body.length){ toast("В файле нет данных"); return; }
      if (!confirm("Объединить файл с текущими данными? Записи с одинаковой датой или id будут заменены данными из файла.")) return;
      const sm = {}; state.sessions.forEach(x => sm[x.id] = x); inc.sessions.forEach(x => sm[x.id] = x);
      const bm = {}; state.body.forEach(x => bm[x.date] = x); inc.body.forEach(x => bm[x.date] = x);
      state.sessions = Object.keys(sm).map(k => sm[k]);
      state.body = Object.keys(bm).map(k => bm[k]);
      if (j && j.data && j.data.startDate) state.startDate = j.data.startDate;
      persist(); render(); toast("Данные импортированы");
    } catch(e){ toast("Не удалось прочитать файл"); }
  };
  fr.readAsText(file);
}

/* ---------- Progression ---------- */
function lastFor(key){
  const list = state.sessions.slice().sort((a,b) => (b.date+b.id).localeCompare(a.date+a.id));
  for (const s of list){ const e = s.entries && s.entries[key]; if (e && e.length) return {date:s.date, sets:e}; }
  return null;
}
function suggest(ex, p, ph){
  const last = lastFor(ex.key);
  if (!last){
    return {w: ex.startW != null ? ex.startW : null, up:false, text:"Старт: " + ex.start};
  }
  const ws = last.sets.map(s => s.w || 0);
  const maxW = Math.max.apply(null, ws);
  const reps = last.sets.map(s => s.r).join(", ");
  const sameW = ws.every(w => w === ws[0]);
  const text = "В прошлый раз, " + dShort(last.date) + ": " + (sameW ? fmt(maxW) + " кг × " + reps
    : last.sets.map(s => fmt(s.w||0) + "×" + s.r).join(", "));
  const atMax = last.sets.filter(s => (s.w||0) === maxW);
  const allTop = atMax.length >= Math.min(p.sets, last.sets.length) && atMax.every(s => s.r >= p.hi);
  if (allTop && !ph.deload && ex.inc > 0) return {w: maxW + ex.inc, up:true, text};
  return {w: maxW, up:false, text};
}
function getDraft(day){
  if (!drafts[day]) drafts[day] = {sets:{}};
  return drafts[day];
}

/* ---------- Render ---------- */
function render(fromSync){
  if (fromSync && ui.tab === "workout" && document.activeElement && document.activeElement.tagName === "INPUT"){
    ui.stale = true; return;
  }
  ui.stale = false;
  document.querySelectorAll(".tabs button").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const app = $("#app");
  if (ui.tab === "workout") app.innerHTML = header() + workout();
  else if (ui.tab === "journal") app.innerHTML = header() + journal();
  else app.innerHTML = food();
}

function header(){
  const w = curWeek(), shown = Math.min(w, 14), ph = phaseOf(shown);
  let strip = "";
  for (let i = 1; i <= 14; i++){
    const c = [i < shown ? "past" : "", i === shown ? "now" : "", (i === 7 || i === 14) ? "deload" : ""].join(" ");
    strip += '<i class="' + c + '"></i>';
  }
  const done = w > 14;
  return '<header class="top">' +
    '<div class="wk"><span class="wk-n">Неделя ' + shown + '</span><span class="wk-of">из 14</span></div>' +
    '<div class="phase">' + (done ? "Программа пройдена" : esc(ph.name)) + '</div>' +
    '<div class="strip" aria-hidden="true">' + strip + '</div>' +
    '<p class="hint">' + (done ? "Сделай фото и замеры, а потом обсудим следующий цикл." : esc(ph.hint)) + '</p>' +
  '</header>';
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function workout(){
  const ph = phaseOf(Math.min(curWeek(), 14));
  const todayDow = new Date().getDay();
  let h = '<div class="days" role="group" aria-label="День">';
  for (const k of ["back","chest","legs"]){
    const d = DAYS[k];
    h += '<button type="button" data-day="' + k + '" aria-pressed="' + (ui.day === k) + '"><small>' + d.wd +
      (d.dow === todayDow ? ", сегодня" : "") + '</small><b>' + d.label + '</b></button>';
  }
  h += '</div>';
  const day = DAYS[ui.day], dr = getDraft(ui.day);
  for (const ex of day.ex){
    const p = planOf(ex, ph), sg = suggest(ex, p, ph);
    let rows = dr.sets[ex.key];
    if (!rows){ rows = dr.sets[ex.key] = []; }
    while (rows.length < p.sets) rows.push({w: sg.w != null ? fmt(sg.w) : "", r:"", done:false});
    const range = p.lo === p.hi ? String(p.lo) : p.lo + "–" + p.hi;
    h += '<section class="ex" data-key="' + ex.key + '">' +
      '<div class="ex-head"><h3>' + esc(ex.name) + '</h3><span class="plan">' + p.sets + ' × ' + range + '</span></div>' +
      '<p class="last">' + esc(sg.text) + (ex.per ? ", " + ex.per : "") + '</p>' +
      (sg.up ? '<p class="up">Пора добавить вес: ' + fmt(sg.w) + ' кг</p>' : '') +
      '<div class="cols" aria-hidden="true"><span></span><span>кг</span><span></span><span>повторы</span><span></span></div>';
    rows.forEach((r, i) => {
      h += '<div class="set' + (r.done ? " done" : "") + '" data-k="' + ex.key + '" data-i="' + i + '" data-rest="' + ex.rest + '">' +
        '<span class="sn">' + (i+1) + '</span>' +
        '<input class="w" inputmode="decimal" autocomplete="off" data-f="w" value="' + esc(r.w) + '" placeholder="кг" aria-label="Вес, подход ' + (i+1) + '">' +
        '<span class="x">×</span>' +
        '<input class="r" inputmode="numeric" autocomplete="off" data-f="r" value="' + esc(r.r) + '" placeholder="' + range + '" aria-label="Повторы, подход ' + (i+1) + '">' +
        '<button type="button" class="chk" data-act="done" aria-label="Подход ' + (i+1) + ' выполнен" aria-pressed="' + !!r.done + '">' + CHECK + '</button>' +
      '</div>';
    });
    h += '<div class="ex-foot"><button type="button" class="ghost" data-act="addset" data-k="' + ex.key + '">+ подход</button>' +
      '<details><summary>Техника</summary><p>' + esc(ex.tip) + '</p><p>Отдых ' + mmss(ex.rest) + '</p></details></div></section>';
  }
  h += '<div class="actions"><button type="button" class="primary" data-act="finish">Завершить тренировку</button>' +
       '<button type="button" class="secondary" data-act="reset">Очистить</button></div>';
  if (store.note) h += '<p class="note">' + esc(store.note) + '</p>';
  return h;
}

function weeklyAvgs(){
  const by = {};
  for (const b of state.body){
    const w = weekOfDate(b.date);
    (by[w] = by[w] || {w:[], waist:[]});
    if (b.weight != null) by[w].w.push(b.weight);
    if (b.waist != null) by[w].waist.push(b.waist);
  }
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  return Object.keys(by).map(Number).sort((a,b)=>a-b)
    .map(k => ({week:k, w:avg(by[k].w), waist:avg(by[k].waist), n:by[k].w.length}));
}
function trend(avgs){
  const pts = avgs.filter(a => a.w != null);
  if (pts.length < 3) return {cls:"idle", text:"Нужно хотя бы 3 недели взвешиваний, чтобы оценить темп набора."};
  const last = pts[pts.length-1];
  const base = pts.filter(p => p.week >= last.week - 4)[0];
  const span = last.week - base.week;
  if (span < 2) return {cls:"idle", text:"Нужно хотя бы 3 недели взвешиваний, чтобы оценить темп набора."};
  const rate = (last.w - base.w) / span * 4.35;
  const r = (rate >= 0 ? "+" : "") + fmt(Math.round(rate*10)/10) + " кг в месяц";
  const ws = avgs.filter(a => a.waist != null);
  let waistUp = false;
  if (ws.length >= 2){
    const a = ws[ws.length-1], b0 = ws.filter(x => x.week >= a.week - 4)[0];
    if (a.week > b0.week && (a.waist - b0.waist) / (a.week - b0.week) * 4.35 > 1) waistUp = true;
  }
  if (rate > 0.7 || waistUp) return {cls:"warn", text:"Темп " + r + (waistUp ? ", талия растёт быстрее 1 см в месяц" : "") + ". Убери 100–150 ккал в день."};
  if (rate < 0.2) return {cls:"warn", text:"Темп " + r + ". Добавь 100–150 ккал в день, лучше за счёт углеводов."};
  return {cls:"ok", text:"Темп " + r + ". Это в цели 0,3–0,5 кг, ничего не меняй."};
}
function spark(avgs){
  const pts = avgs.filter(a => a.w != null);
  if (pts.length < 2) return "";
  const W = 320, H = 90, px = 26, py = 14;
  const ws = pts.map(p => p.w), lo = Math.min.apply(null, ws), hi = Math.max.apply(null, ws);
  const pad = Math.max(0.3, (hi - lo) * 0.15), y0 = lo - pad, y1 = hi + pad;
  const xs = i => px + (W - px*2) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const ys = v => H - py - (H - py*2) * (v - y0) / (y1 - y0);
  const line = pts.map((p,i) => xs(i).toFixed(1) + "," + ys(p.w).toFixed(1)).join(" ");
  const L = pts[pts.length-1], F = pts[0];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Средний вес по неделям">' +
    '<polyline points="' + line + '"/>' +
    '<circle cx="' + xs(pts.length-1).toFixed(1) + '" cy="' + ys(L.w).toFixed(1) + '" r="4"/>' +
    '<text x="' + xs(0) + '" y="' + (H-1) + '" text-anchor="middle">нед. ' + F.week + '</text>' +
    '<text x="' + xs(pts.length-1) + '" y="' + (H-1) + '" text-anchor="middle">нед. ' + L.week + '</text>' +
    '<text x="' + xs(pts.length-1) + '" y="' + (ys(L.w) - 9).toFixed(1) + '" text-anchor="end">' + fmt(Math.round(L.w*10)/10) + ' кг</text>' +
  '</svg>';
}

        h += '<div><b>' + esc(NAME_BY_KEY[k] || k) + ':</b> ' + s.entries[k].map(x => fmt(x.w) + "×" + x.r).join(", ") + '</div>';
      });
      h += '<button type="button" class="del" data-act="delsess" data-id="' + esc(s.id) + '">Удалить тренировку</button></div>';
    }
    h += '</div>';

  h += '</section>';
  h += '<section class="card"><h2>Программа</h2><div class="form">' +
    '<label class="full">Первый день недели 1<input id="sdate" type="date" value="' + esc(state.startDate) + '"></label></div>' +

  h += '<section class="card"><h2>Резервная копия</h2>' +
    '<p class="muted">Записей: ' + state.sessions.length + ' тренировок, ' + state.body.length + ' взвешиваний.</p>' +
    '<div class="actions" style="margin-top:8px"><button type="button" class="primary" data-act="export">Экспорт</button>' +
    '<label class="secondary" style="cursor:pointer">Импорт<input id="impf" type="file" accept="application/json,.json" hidden></label></div>' +
    (store.note ? '<p class="note">' + esc(store.note) + '</p>' : '') + '</section>';

/* ---------- Timer ---------- */
const timer = {end:0, total:0, id:null};
function startTimer(sec){
  timer.total = sec; timer.end = Date.now() + sec*1000;
  $("#timer").classList.add("on"); $("#timer").classList.remove("done");
  $("#tL").textContent = "Отдых";
  clearInterval(timer.id); timer.id = setInterval(tick, 250); tick();
}
function tick(){
  const left = (timer.end - Date.now()) / 1000;
  $("#tT").textContent = mmss(Math.ceil(left));
  $("#tB").style.width = Math.max(0, Math.min(100, 100 * (1 - left / timer.total))) + "%";
  if (left <= 0){
    clearInterval(timer.id);
    $("#timer").classList.add("done");
    $("#tT").textContent = "0:00";
    $("#tL").textContent = "Отдых окончен, следующий подход";
    try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
    setTimeout(() => { if (Date.now() >= timer.end) stopTimer(); }, 6000);
  }
}
function stopTimer(){ clearInterval(timer.id); $("#timer").classList.remove("on","done"); }

let toastT = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400);
}

});

    if (ui.stale && !(a && a.tagName === "INPUT")) render();
  }, 50);
});

document.addEventListener("change", e => {
  if (e.target.id === "impf" && e.target.files && e.target.files[0]){ importData(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "sdate" && e.target.value){
    state.startDate = e.target.value; persist(); render(); toast("Дата начала обновлена");
  }
});

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ ui.tab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const day = e.target.closest("[data-day]");
  if (day){ ui.day = day.dataset.day; render(); return; }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === "done"){
    const row = btn.closest(".set"), k = row.dataset.k, i = +row.dataset.i;
    const r = getDraft(ui.day).sets[k][i];
    if (!r.done){
      if (num(r.r) == null){ row.querySelector(".r").focus(); toast("Впиши число повторов"); return; }
      r.done = true; row.classList.add("done"); btn.setAttribute("aria-pressed","true");
      startTimer(+row.dataset.rest || 90);
      const rows = getDraft(ui.day).sets[k];
      const next = row.parentElement.querySelector('.set[data-k="' + k + '"][data-i="' + (i+1) + '"] .w');
      if (next && !rows[i+1].done && !rows[i+1].w && r.w){ rows[i+1].w = r.w; next.value = r.w; }
    } else {
      r.done = false; row.classList.remove("done"); btn.setAttribute("aria-pressed","false");
    }
    saveDraftSoon();
  }
  else if (act === "addset"){
    const k = btn.dataset.k, rows = getDraft(ui.day).sets[k];
    const prev = rows[rows.length-1];
    rows.push({w: prev ? prev.w : "", r:"", done:false});
    saveDraftSoon(); render();
  }
  else if (act === "reset"){
    if (!confirm("Очистить введённые подходы этой тренировки?")) return;
    delete drafts[ui.day]; saveLS(LS_DRAFT, drafts); render();
  }
  else if (act === "finish"){
    const dr = getDraft(ui.day), entries = {};
    Object.keys(dr.sets).forEach(k => {
      const done = dr.sets[k].filter(s => s.done && num(s.r) != null).map(s => ({w: num(s.w) || 0, r: Math.round(num(s.r))}));
      if (done.length) entries[k] = done;
    });
    if (!Object.keys(entries).length){ toast("Отметь хотя бы один выполненный подход"); return; }
    const d = todayISO();
    state.sessions.push({id: Date.now().toString(36), date: d, day: ui.day, week: weekOfDate(d), entries});
    delete drafts[ui.day]; saveLS(LS_DRAFT, drafts);
    stopTimer(); persist(); render(); window.scrollTo(0,0);
    toast("Тренировка сохранена");
  }
  else if (act === "addbody"){
    const w = num($("#bw").value), waist = num($("#bwaist").value), date = $("#bdate").value || todayISO();
    if (w == null || w < 30 || w > 250){ toast("Впиши вес в килограммах"); $("#bw").focus(); return; }
    state.body = state.body.filter(b => b.date !== date);
    const entry = {date, weight: w};
    if (waist != null && waist > 40 && waist < 200) entry.waist = waist;
    state.body.push(entry);
    persist(); render(); toast("Записано");
  }
  else if (act === "delbody"){
    if (!confirm("Удалить запись?")) return;
    state.body = state.body.filter(b => b.date !== btn.dataset.date); persist(); render();
  }
  else if (act === "hist"){
    ui.open = ui.open === btn.dataset.id ? null : btn.dataset.id; render();
  }
  else if (act === "delsess"){
    if (!confirm("Удалить эту тренировку из истории?")) return;
    state.sessions = state.sessions.filter(s => s.id !== btn.dataset.id); ui.open = null; persist(); render();
  }
  else if (act === "export"){ exportData(); }
  else if (act === "t-minus"){ timer.end -= 15000; timer.total = Math.max(1, timer.total - 15); tick(); }
  else if (act === "t-plus"){ if ($("#timer").classList.contains("done")) startTimer(15); else { timer.end += 15000; timer.total += 15; tick(); } }
  else if (act === "t-stop"){ stopTimer(); }
});

initStore();
})();
</script>
</body>
</html>
